<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="110" fill="#ffffff" opacity="0.5"/>

  <!-- Headphone assembly with shadow -->
  <g filter="url(#dropShadow)">
    <!-- Headband Arc Outer -->
    <path d="M 120 220 C 120 110, 280 110, 280 220" fill="none" stroke="url(#bandGrad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Headband Inner Cushion -->
    <path d="M 136 205 C 136 126, 264 126, 264 205" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Metal Extenders -->
    <rect x="112" y="200" width="16" height="36" rx="4" fill="url(#metalGrad)"/>
    <rect x="272" y="200" width="16" height="36" rx="4" fill="url(#metalGrad)"/>

    <!-- Left Ear Cup Pivot & Cup -->
    <g transform="translate(90, 215)">
      <!-- Outer Pivot Yoke -->
      <path d="M 30 10 C 12 10, 12 60, 30 60" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
      <!-- Outer Cup Shell -->
      <rect x="8" y="2" width="46" height="74" rx="22" fill="url(#cupGrad)"/>
      <ellipse cx="31" cy="39" rx="16" ry="26" fill="#090d16"/>
      <!-- Soft Cushion Ring -->
      <path d="M 36 6 C 54 10, 58 68, 36 72" fill="#334155" opacity="0.9"/>
      <!-- Blue Accent Ring -->
      <ellipse cx="25" cy="39" rx="9" ry="16" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
    </g>

    <!-- Right Ear Cup Pivot & Cup -->
    <g transform="translate(260, 215)">
      <!-- Outer Pivot Yoke -->
      <path d="M 20 10 C 38 10, 38 60, 20 60" fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
      <!-- Outer Cup Shell -->
      <rect x="-4" y="2" width="46" height="74" rx="22" fill="url(#cupGrad)"/>
      <ellipse cx="19" cy="39" rx="16" ry="26" fill="#090d16"/>
      <!-- Soft Cushion Ring -->
      <path d="M 14 6 C -4 10, -8 68, 14 72" fill="#334155" opacity="0.9"/>
      <!-- Blue Accent Ring -->
      <ellipse cx="25" cy="39" rx="9" ry="16" fill="none" stroke="url(#accentGrad)" stroke-width="2"/>
    </g>
  </g>

  <!-- Bluetooth / Sound Wave Badge -->
  <g transform="translate(176, 280)">
    <rect width="48" height="24" rx="12" fill="#0f172a" opacity="0.9"/>
    <circle cx="16" cy="12" r="3" fill="#38bdf8"/>
    <path d="M 24 8 Q 28 12 24 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 29 6 Q 35 12 29 18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
