<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="swBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="swShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="24" fill="url(#swBgGrad)"/>
  
  <circle cx="200" cy="200" r="140" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="110" fill="#ffffff" opacity="0.5"/>

  <!-- Watch assembly with shadow -->
  <g filter="url(#swShadow)">
    <!-- Top Strap -->
    <path d="M 160 50 L 164 135 L 236 135 L 240 50 Z" fill="url(#strapGrad)" rx="6"/>
    <!-- Top Strap Detail Lines -->
    <line x1="172" y1="80" x2="228" y2="80" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="174" y1="100" x2="226" y2="100" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom Strap -->
    <path d="M 164 265 L 160 350 L 240 350 L 236 265 Z" fill="url(#strapGrad)" rx="6"/>
    <!-- Bottom Strap Holes -->
    <circle cx="200" cy="290" r="4" fill="#0f172a"/>
    <circle cx="200" cy="310" r="4" fill="#0f172a"/>
    <circle cx="200" cy="330" r="4" fill="#0f172a"/>

    <!-- Watch Case -->
    <rect x="135" y="130" width="130" height="140" rx="36" fill="url(#caseGrad)" stroke="#475569" stroke-width="2"/>

    <!-- Crown Button -->
    <rect x="265" y="180" width="8" height="26" rx="3" fill="#94a3b8"/>
    <rect x="265" y="185" width="2" height="16" fill="#475569"/>

    <!-- Watch Display (OLED bezel & screen) -->
    <rect x="144" y="139" width="112" height="122" rx="30" fill="url(#screenGrad)"/>

    <!-- Screen UI Elements -->
    <!-- Time -->
    <text x="200" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" text-anchor="middle">10:24</text>
    <text x="200" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">SAT, 21 NOV</text>

    <!-- Activity Rings / Arc -->
    <circle cx="172" cy="232" r="14" fill="none" stroke="#334155" stroke-width="3"/>
    <path d="M 172 218 A 14 14 0 1 1 160 238" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Heart Icon & BPM -->
    <path d="M 172 229 C 172 227 170 225 168 227 C 166 229 172 235 172 235 C 172 235 178 229 176 227 C 174 225 172 227 172 229 Z" fill="#ef4444"/>

    <!-- Fitness Step Count -->
    <text x="216" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981">8,420</text>
    <text x="216" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b">STEPS</text>
  </g>
</svg>
